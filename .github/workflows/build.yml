name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk libtool pkg-config autoconf automake gettext

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages buildozer "cython<3.0.0"

      - name: Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: eyetracker-apk
          path: bin/*.apk

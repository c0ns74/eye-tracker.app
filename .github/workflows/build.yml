name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v4

    - name: Aumentar espacio de Swap (para OpenCV)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk
        pip install --upgrade pip setuptools
        pip install buildozer cython

    - name: Ajustar limites de red en Git
      run: |
        git config --global http.postBuffer 524288000
        git config --global http.version HTTP/1.1

    - name: Compilar APK con Buildozer
      run: buildozer -v android debug

    - name: Subir APK como artefacto
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
        name: app-debug-apk
        path: bin/*.apk
